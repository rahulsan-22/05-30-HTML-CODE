<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elements 🧡</title>
</head>
<body>
  <!-- BLOCK LEVEL ELEMENTS -->
  <h1 style="border:5px solid red;">Feeling Hungry?😩</h1>
  <p style="border:10px solid lime;">Yeah feeling hungry but this trainer is not ending the class</p>
  <!-- INLINE ELEMENTS -->
  <b style="border: 5px solid blue;">Feeling Sleepy?😴</b>
  <i style="border: 5px solid hotpink;">Yeah feeling sleepy but this trainer is shouting like anything</>
</body>
</html>
