<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forms 😉</title>
</head>

<body>
  <form action="" method="">
    <fieldset>
      <legend>Registration Form 🔥</legend>
      <label for="name">Name:</label>
      <input type="text" id="name" placeholder="Enter your name 😉" required autofocus value="Rahul" readonly>
      <br><br>
      <label for="email">Email:</label>
      <input type="email" id="email" placeholder="Enter your email 📧" disabled value="rahul@gmail.com">
      <br><br>
      <label for="password">Password:</label>
      <input type="password" id="password">
      <br><br>
      <label for="age">Age:</label>
      <input type="number" id="age" min="18" max="25" step="2">
      <br><br>
      <label for="phone">Phone:</label>
      <input type="tel" id="phone">
      <br><br>
      <label for="dob">Dob:</label>
      <input type="date">
      <input type="datetime-local">
      <input type="month">
      <input type="week">
      <input type="time">
      <br><br>
      <label>Gender:</label>
      <input type="radio" id="male" name="gender" value="male" checked>
      <label for="male">Male</label>
      <input type="radio" id="female" name="gender" value="female">
      <label for="female">Female</label>
      <br><br>
      <label>Skills:</label>
      <input type="checkbox" id="html" name="skills" value="html" checked>
      <label for="html">Html</label>
      <input type="checkbox" id="css" name="skills" value="css" checked>
      <label for="css">Css</label>
      <input type="checkbox" id="js" name="skills" value="js">
      <label for="js">Js</label>
      <input type="checkbox" id="react" name="skills" value="react">
      <label for="react">React.Js</label>
      <br><br>
      <label for="photo">Upload Id:</label>
      <input type="file" id="photo" multiple accept=".pdf,.jpg">
      <br><br>
      <label for="country">Country:</label>
      <select id="country">
        <option disabled selected>--Select Country--</option>
        <option>India</option>
        <option>Russia</option>
        <option>Japan</option>
        <option>Thailand</option>
        <option>Germany</option>
      </select>
      <br><br>
      <label for="feedback">Feedback:</label>
      <textarea id="feedback" rows="10" cols="100" minlength="10" maxlength="50" required></textarea>
      <br><br>
      <label for="color">Select Color:</label>
      <input type="color" id="color">
      <br><br>
      <label for="brightness">Brightness:</label>
      <input type="range" id="brightness">
      <br><br>
      <input type="submit" value="Register 💖">
      <input type="reset" value="Clear">
    </fieldset>
  </form>
</body>

</html>
